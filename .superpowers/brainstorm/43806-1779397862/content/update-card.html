<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luma Update Card Mockup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 48px;
    padding: 48px 32px;
    min-height: 100vh;
    color: #ECEEED;
  }

  .scene-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #666;
    text-align: center;
    margin-bottom: 12px;
  }

  /* ── Menu bar simulation ── */
  .menu-bar {
    position: relative;
    width: 356px;
    height: 24px;
    background: #1e1e1e;
    border-radius: 6px 6px 0 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 12px;
    gap: 14px;
    border-bottom: 1px solid #333;
  }

  .menu-bar-icon {
    width: 16px;
    height: 16px;
    opacity: 0.8;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .menu-bar-icon svg {
    width: 14px;
    height: 14px;
    fill: #ECEEED;
  }

  .menu-bar-icon.active svg {
    fill: #fff;
  }

  /* ── Panel ── */
  .panel {
    width: 356px;
    background: #141614;
    border-radius: 12px;
    border: 1px solid #2E322E;
    overflow: hidden;
    box-shadow:
      0 0 0 0.5px rgba(255,255,255,0.04) inset,
      0 20px 60px rgba(0,0,0,0.7),
      0 4px 16px rgba(0,0,0,0.5);
  }

  /* ── Panel header ── */
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 10px;
    background: #1A1C1A;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #2563EB;
    box-shadow: 0 0 6px rgba(37,99,235,0.8);
    flex-shrink: 0;
  }

  .header-title {
    font-size: 13px;
    font-weight: 600;
    color: #ECEEED;
    letter-spacing: -0.01em;
  }

  .header-subtitle {
    font-size: 11px;
    color: #5A6358;
    margin-left: 2px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .icon-btn {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: #212421;
    border: 1px solid #2E322E;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #7A8A78;
    font-size: 12px;
  }

  /* ── Divider ── */
  .divider {
    height: 1px;
    background: #2E322E;
    margin: 0 16px;
  }

  /* ── UPDATE CARD ── */
  .update-card {
    margin: 10px 14px;
    background: linear-gradient(135deg, #0d1a2e 0%, #111a10 100%);
    border: 1px solid #1e3a5f;
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    overflow: hidden;
  }

  .update-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(37,99,235,0.4), transparent);
  }

  .update-card-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .update-icon {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    background: rgba(37,99,235,0.15);
    border: 1px solid rgba(37,99,235,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #4f8ef7;
    font-size: 13px;
  }

  .update-text {
    flex: 1;
    min-width: 0;
  }

  .update-title {
    font-size: 12px;
    font-weight: 600;
    color: #ECEEED;
    line-height: 1.2;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .version-badge {
    font-size: 10px;
    font-weight: 600;
    color: #4f8ef7;
    background: rgba(37,99,235,0.15);
    border: 1px solid rgba(37,99,235,0.25);
    border-radius: 4px;
    padding: 1px 5px;
    letter-spacing: 0.02em;
    font-family: "SF Mono", monospace;
  }

  .update-subtitle {
    font-size: 11px;
    color: #5A6A58;
    margin-top: 1px;
    line-height: 1.3;
  }

  .update-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-update {
    flex: 1;
    height: 26px;
    background: #2563EB;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    letter-spacing: -0.01em;
  }

  .btn-dismiss {
    height: 26px;
    padding: 0 10px;
    background: transparent;
    border: 1px solid #2E322E;
    border-radius: 6px;
    color: #5A6A58;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
  }

  /* ── rest of panel content (mocked, dimmed) ── */
  .panel-content {
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    opacity: 0.45;
  }

  .content-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .content-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #212421;
    border: 1px solid #2E322E;
    flex-shrink: 0;
  }

  .content-lines {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .content-line {
    height: 9px;
    background: #2E322E;
    border-radius: 3px;
  }

  .content-line.short { width: 55%; }
  .content-line.med   { width: 75%; }
  .content-line.long  { width: 90%; }

  .divider-subtle {
    height: 1px;
    background: #222422;
    margin: 0;
  }

  .panel-footer {
    padding: 10px 16px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    opacity: 0.35;
  }

  .footer-pill {
    height: 22px;
    width: 80px;
    background: #212421;
    border-radius: 100px;
    border: 1px solid #2E322E;
  }

  .footer-icon {
    width: 22px;
    height: 22px;
    background: #212421;
    border-radius: 6px;
    border: 1px solid #2E322E;
  }

  /* ── annotation ── */
  .annotation {
    position: absolute;
    right: -130px;
    display: flex;
    align-items: center;
    gap: 8px;
    top: 50%;
    transform: translateY(-50%);
  }

  .annotation-line {
    width: 40px;
    height: 1px;
    background: #3A3F3A;
  }

  .annotation-text {
    font-size: 11px;
    color: #5A6A58;
    white-space: nowrap;
    line-height: 1.5;
  }

  .panel-wrapper {
    position: relative;
  }

  /* ── comparison: no update state ── */
  .no-update-card {
    margin: 10px 14px;
    background: transparent;
    /* nothing renders — slot is empty */
    height: 0;
  }
</style>
</head>
<body>

<!-- LEFT: With update card -->
<div>
  <p class="scene-label">Update available</p>
  <div class="menu-bar">
    <div class="menu-bar-icon">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="#ECEEED" stroke-width="1.5"/><path d="M8 5v4M8 11v.5" stroke="#ECEEED" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
    <div class="menu-bar-icon active">
      <!-- Luma icon (sparkle/star) -->
      <svg viewBox="0 0 16 16"><path d="M8 2 L9 6.5 L13.5 7.5 L9 8.5 L8 13 L7 8.5 L2.5 7.5 L7 6.5 Z" fill="#ECEEED"/></svg>
    </div>
  </div>

  <div class="panel-wrapper">
    <div class="panel">
      <!-- Header -->
      <div class="panel-header">
        <div class="header-left">
          <div class="status-dot"></div>
          <span class="header-title">Luma</span>
          <span class="header-subtitle">idle</span>
        </div>
        <div class="header-actions">
          <div class="icon-btn">⚙</div>
          <div class="icon-btn">✕</div>
        </div>
      </div>
      <div class="divider"></div>

      <!-- UPDATE CARD -->
      <div class="update-card">
        <div class="update-card-top">
          <div class="update-icon">↑</div>
          <div class="update-text">
            <div class="update-title">
              Update available
              <span class="version-badge">v0.7.0</span>
            </div>
            <div class="update-subtitle">New features + bug fixes · 3 days ago</div>
          </div>
        </div>
        <div class="update-actions">
          <button class="btn-update">↓ Download</button>
          <button class="btn-dismiss">Dismiss</button>
        </div>
      </div>

      <!-- Rest of panel (dimmed to focus attention on card) -->
      <div class="panel-content">
        <div class="content-row">
          <div class="content-icon"></div>
          <div class="content-lines">
            <div class="content-line med"></div>
            <div class="content-line short"></div>
          </div>
        </div>
        <div class="content-row">
          <div class="content-icon"></div>
          <div class="content-lines">
            <div class="content-line long"></div>
            <div class="content-line med"></div>
          </div>
        </div>
      </div>

      <div class="divider-subtle"></div>

      <div class="panel-footer">
        <div class="footer-pill"></div>
        <div style="display:flex;gap:6px">
          <div class="footer-icon"></div>
          <div class="footer-icon"></div>
        </div>
      </div>
    </div>
  </div>
</div>


<!-- RIGHT: No update (normal state) -->
<div>
  <p class="scene-label">No update · normal state</p>
  <div class="menu-bar">
    <div class="menu-bar-icon">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="#ECEEED" stroke-width="1.5"/><path d="M8 5v4M8 11v.5" stroke="#ECEEED" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
    <div class="menu-bar-icon active">
      <svg viewBox="0 0 16 16"><path d="M8 2 L9 6.5 L13.5 7.5 L9 8.5 L8 13 L7 8.5 L2.5 7.5 L7 6.5 Z" fill="#ECEEED"/></svg>
    </div>
  </div>

  <div class="panel">
    <!-- Header -->
    <div class="panel-header">
      <div class="header-left">
        <div class="status-dot"></div>
        <span class="header-title">Luma</span>
        <span class="header-subtitle">idle</span>
      </div>
      <div class="header-actions">
        <div class="icon-btn">⚙</div>
        <div class="icon-btn">✕</div>
      </div>
    </div>
    <div class="divider"></div>

    <!-- No update card — panel goes straight to content -->

    <div class="panel-content" style="opacity:1">
      <div class="content-row">
        <div class="content-icon"></div>
        <div class="content-lines">
          <div class="content-line med"></div>
          <div class="content-line short"></div>
        </div>
      </div>
      <div class="content-row">
        <div class="content-icon"></div>
        <div class="content-lines">
          <div class="content-line long"></div>
          <div class="content-line med"></div>
        </div>
      </div>
      <div class="content-row">
        <div class="content-icon"></div>
        <div class="content-lines">
          <div class="content-line short"></div>
          <div class="content-line long"></div>
        </div>
      </div>
    </div>

    <div class="divider-subtle"></div>

    <div class="panel-footer">
      <div class="footer-pill"></div>
      <div style="display:flex;gap:6px">
        <div class="footer-icon"></div>
        <div class="footer-icon"></div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
